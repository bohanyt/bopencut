name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  build:
    # One OS is enough; a three-OS matrix wastes minutes if the repository becomes private (macOS counts 10x).
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "supersecret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Public repository: reject AI attribution and private paths in files and PR commit messages.
      - name: Check public repository hygiene
        run: |
          pola='co-authored-by|claude|anthropic|[A-Za-z]:[\/]Users[\/]'
          if git grep -nIiE "$pola" -- . ':!bun.lock' ':!.github/workflows'; then
            echo "::error::AI attribution or private path found in repository files"; exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git log --format=%B "origin/${{ github.base_ref }}..HEAD" | grep -iE "$pola"; then
              echo "::error::AI attribution or private path found in commit messages"; exit 1
            fi
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        working-directory: apps/web
        run: bun install

      - name: Build
        working-directory: apps/web
        run: bun run build

      - name: Run tests
        working-directory: apps/web
        run: bun test
